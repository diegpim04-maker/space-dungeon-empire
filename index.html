<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SPACE_DUNGEON_COLLECTION // PHYSICAL_&_DIGITAL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root { 
            --neon-green: #00ff9d; 
            --neon-purple: #9d00ff; 
            --deep-bg: #000000; 
            --text-main: #ffffff;
            --text-dim: #666666;
            --border: #111111;
        }

        * { box-sizing: border-box; }
        body { 
            background: var(--deep-bg); 
            color: var(--text-main); 
            font-family: 'Outfit', sans-serif; 
            margin: 0; 
            padding: 0; 
            overflow-x: hidden; 
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
        }

        /* PREMIUM TYPOGRAPHY */
        h1, h2, h3, h4, .mono { 
            font-family: 'Space Mono', monospace; 
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        .hero { height: 60vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; border-bottom: 1px solid var(--border); }
        .hero h1 { 
            font-size: 5rem; 
            font-weight: 800;
            letter-spacing: 0.4em; 
            color: #fff;
            margin: 0;
            line-height: 1;
        }
        .hero p { font-family: 'Space Mono', monospace; font-size: 0.65rem; color: #444; letter-spacing: 0.8em; margin-top: 25px; font-style: italic; }

        .btn-outline { 
            color: #555; 
            font-family: 'Space Mono', monospace; 
            text-decoration: none; 
            border: 1px solid #222; 
            padding: 12px 35px; 
            font-size: 10px; 
            transition: 0.4s;
            letter-spacing: 3px;
        }
        .btn-outline:hover { color: #fff; border-color: #fff; background: #fff; color: #000; }

        .container { max-width: 1400px; margin: 0 auto; padding: 100px 60px; }
        .section-title { 
            font-size: 0.7rem; 
            color: #333; 
            border-left: 2px solid var(--neon-green); 
            padding-left: 30px; 
            margin: 120px 0 50px 0; 
            letter-spacing: 6px;
            font-family: 'Space Mono', monospace;
        }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 80px; }
        
        .card { 
            background: transparent; 
            padding: 0; 
            transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1); 
            position: relative; 
            cursor: pointer; 
        }
        .card:hover { transform: translateY(-15px); }
        
        .img-box { width: 100%; height: 450px; background: #050505; overflow: hidden; position: relative; border: 1px solid #111; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; transition: 0.8s cubic-bezier(0.19, 1, 0.22, 1); }
        .card:hover .img-box img { transform: scale(1.1); opacity: 1; filter: grayscale(0); }

        .card-info { padding: 40px 0; }
        .card-name { font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 8px; letter-spacing: 2px; }
        .price { font-family: 'Space Mono', monospace; font-size: 1.1rem; color: #555; font-weight: 400; }

        /* MODAL STYLES */
        .modal { display: none; position: fixed; z-index: 5000; left: 0; top: 0; width: 100%; height: 100%; background: #000; overflow-y: auto; }
        .modal-content { max-width: 1300px; margin: 0 auto; padding: 120px 60px; }
        .close-modal { position: fixed; right: 60px; top: 60px; color: #fff; font-size: 11px; font-family: 'Space Mono'; cursor: pointer; opacity: 0.2; transition: 0.4s; z-index: 6000; border: 1px solid #333; padding: 10px 20px; letter-spacing: 2px; }
        .close-modal:hover { opacity: 1; border-color: #fff; background: #fff; color: #000; }
        
        .modal-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 120px; }
        @media (max-width: 1100px) { .modal-grid { grid-template-columns: 1fr; gap: 80px; } }

        .modal-img-container { width: 100%; height: 600px; background: #050505; border: 1px solid #111; overflow: hidden; position: relative; cursor: grab; display: flex; align-items: center; justify-content: center; }
        .modal-main-img { width: 85%; height: 85%; object-fit: contain; transition: transform 0.1s linear; pointer-events: none; }
        
        .thumbnail-row { display: flex; gap: 20px; margin-top: 30px; justify-content: flex-start; }
        .thumb { width: 100px; height: 100px; border: 1px solid #111; cursor: pointer; opacity: 0.2; transition: 0.4s; object-fit: cover; filter: grayscale(100%); }
        .thumb:hover, .thumb.active { opacity: 1; border-color: #fff; filter: grayscale(0%); }

        .modal-title { font-size: 4.5rem; font-weight: 800; color: #fff; margin: 0 0 30px 0; line-height: 0.9; letter-spacing: -2px; }
        .modal-desc { font-size: 1rem; color: #666; line-height: 2; margin-bottom: 60px; font-weight: 400; text-transform: lowercase; }
        
        .specs-list { list-style: none; padding: 0; margin: 60px 0; border-top: 1px solid #111; }
        .specs-list li { padding: 20px 0; border-bottom: 1px solid #111; font-size: 12px; color: #999; display: flex; justify-content: space-between; font-family: 'Space Mono'; }
        .specs-list li b { color: #fff; font-size: 10px; }

        .buy-now-btn { 
            background: #fff; 
            color: #000; 
            border: none; 
            padding: 30px 50px; 
            font-family: 'Space Mono', monospace; 
            font-weight: 700; 
            font-size: 1.1rem; 
            width: 100%; 
            display: block; 
            text-align: center; 
            text-decoration: none;
            transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            letter-spacing: 5px;
        }
        .buy-now-btn:hover { background: var(--neon-green); letter-spacing: 8px; }

        .footer { text-align: center; padding: 150px 60px; font-size: 10px; color: #222; font-family: 'Space Mono', monospace; border-top: 1px solid #111; margin-top: 150px; letter-spacing: 5px;}
    </style>
</head>
<body>
    <div class="hero">
        <h1>SPACE_DUNGEON</h1>
        <p>HI-FIDELITY AUTOMATED EXTRACTION GEAR</p>
        <div style="margin-top: 60px; display: flex; gap: 30px;">
            <a href="tracking.html" class="btn-outline">LOGISTICS</a>
            <a href="support.html" class="btn-outline">SUPPORT</a>
        </div>
    </div>

    <div class="container">
        <div class="section-title">01 / PHYSICAL_UNITS</div>
        <div class="grid" id="physical-grid"></div>

        <div class="section-title">02 / CORE_BLUEPRINTS</div>
        <div class="grid" id="digital-grid"></div>
    </div>

    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">CLOSE</span>
            <div class="modal-grid">
                <div>
                    <div class="modal-img-container" id="interactionZone">
                        <img id="modal-img" src="" class="modal-main-img">
                    </div>
                    <div id="thumbnail-row" class="thumbnail-row"></div>
                    <p style="font-size: 9px; color: #222; text-align: left; margin-top: 40px; font-family: 'Space Mono'; letter-spacing: 4px;">// TACTICAL VISUAL OVERRIDE: ACTIVE</p>
                </div>
                <div>
                    <h2 id="modal-title" class="modal-title">ITEM</h2>
                    <p id="modal-desc" class="modal-desc"></p>
                    <ul id="modal-specs" class="specs-list"></ul>
                    <div id="modal-price" style="font-size:4.5rem; color: #fff; font-weight: 800; font-family: 'Space Mono'; margin-bottom: 60px; letter-spacing: -4px;">$0.00</div>
                    <a id="modal-buy-btn" href="#" class="buy-now-btn" onclick="initiatePurchase(event)">ACQUIRE_UNIT</a>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">DIEGP04.MAKER // CORE_OS // 2026</div>

    <script>
        let isDragging = false;
        let startX = 0;
        let currentRotation = 0;
        const mainImg = document.getElementById('modal-img');
        const zone = document.getElementById('interactionZone');

        zone.addEventListener('mousedown', (e) => { isDragging = true; startX = e.clientX; });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - startX;
            startX = e.clientX;
            currentRotation += deltaX * 0.4;
            mainImg.style.transform = `perspective(2000px) rotateY(${currentRotation}deg)`;
        });
        window.addEventListener('mouseup', () => { isDragging = false; });

        function changeAngle(el, src) {
            mainImg.src = src;
            document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            currentRotation = 0;
            mainImg.style.transform = `perspective(2000px) rotateY(0deg)`;
        }

        function openModal(id) {
            const p = window.allProducts.find(item => item.id === id);
            if(!p) return;
            window.activeProduct = p;
            document.getElementById('modal-title').innerText = p.name;
            document.getElementById('modal-desc').innerText = p.desc;
            document.getElementById('modal-price').innerText = p.price;
            mainImg.src = p.img;
            document.getElementById('thumbnail-row').innerHTML = [p.img, ...(p.gallery || [])].map((src, i) => `
                <img src="${src}" class="thumb ${i===0?'active':''}" onclick="changeAngle(this, '${src}')">
            `).join('');
            document.getElementById('modal-specs').innerHTML = p.bullets.map(b => `<li>${b}</li>`).join('');
            document.getElementById('productModal').style.display = "block";
            document.body.style.overflow = "hidden";
        }

        function closeModal() { 
            document.getElementById('productModal').style.display = "none"; 
            document.body.style.overflow = "auto";
        }

        function initiatePurchase(e) {
            e.preventDefault();
            const p = window.activeProduct;
            window.location.href = `checkout.html?item=${encodeURIComponent(p.name)}&price=${p.price.replace('$','')}&img=${encodeURIComponent(p.img)}&id=${p.id}&qty=1`;
        }

        async function loadStore() {
            const res = await fetch('inventory.json');
            const products = await res.json();
            window.allProducts = products;
            
            const pGrid = document.getElementById('physical-grid');
            const dGrid = document.getElementById('digital-grid');

            products.forEach(p => {
                const target = p.yield === 'PHYSICAL' ? pGrid : dGrid;
                target.innerHTML += `
                    <div class="card" onclick="openModal('${p.id}')">
                        <div class="img-box"><img src="${p.img}"></div>
                        <div class="card-info">
                            <div class="card-name">${p.name}</div>
                            <div class="price">${p.price}</div>
                        </div>
                    </div>
                `;
            });
        }
        loadStore();
    </script>
</body>
</html>
