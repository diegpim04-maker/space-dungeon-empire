<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SPACE_DUNGEON_COLLECTION // PHYSICAL_&_DIGITAL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root { 
            --neon-green: #00ff9d; 
            --neon-purple: #9d00ff; 
            --deep-bg: #000000; 
            --text-main: #ffffff;
            --text-dim: #666666;
            --border: #1a1a1a;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; }
        body { 
            background: radial-gradient(circle at 50% 50%, #0a0510 0%, #000 100%);
            color: var(--text-main); 
            font-family: 'Outfit', sans-serif; 
            margin: 0; 
            padding: 0; 
            overflow-x: hidden; 
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
        }

        /* PREMIUM TYPOGRAPHY */
        h1, h2, h3, h4, .mono { 
            font-family: 'Space Mono', monospace; 
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        .hero { height: 70vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; border-bottom: 1px solid var(--border); position: relative; overflow: hidden; }
        .hero::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 1px, rgba(157, 0, 255, 0.05) 1px, rgba(157, 0, 255, 0.05) 2px);
            pointer-events: none;
        }
        .hero h1 { 
            font-size: 6rem; 
            font-weight: 800;
            letter-spacing: 0.6em; 
            background: linear-gradient(to bottom, #fff 0%, #444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            line-height: 1;
            filter: drop-shadow(0 0 30px rgba(157, 0, 255, 0.3));
        }
        .hero p { font-family: 'Space Mono', monospace; font-size: 0.7rem; color: var(--neon-purple); letter-spacing: 0.8em; margin-top: 35px; font-weight: 700; text-shadow: 0 0 10px rgba(157, 0, 255, 0.5); }

        .btn-outline { 
            color: #fff; 
            font-family: 'Space Mono', monospace; 
            text-decoration: none; 
            border: 1px solid var(--neon-purple); 
            padding: 15px 45px; 
            font-size: 11px; 
            transition: 0.4s;
            letter-spacing: 4px;
            background: rgba(157, 0, 255, 0.05);
            backdrop-filter: blur(10px);
        }
        .btn-outline:hover { background: var(--neon-purple); color: #fff; box-shadow: 0 0 20px var(--neon-purple); }

        .container { max-width: 1600px; margin: 0 auto; padding: 100px 60px; }
        .section-title { 
            font-size: 0.8rem; 
            color: #fff; 
            border-left: 3px solid var(--neon-purple); 
            padding-left: 30px; 
            margin: 150px 0 60px 0; 
            letter-spacing: 8px;
            font-family: 'Space Mono', monospace;
            text-shadow: 0 0 15px var(--neon-purple);
        }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 40px; }
        
        .card { 
            background: var(--glass-bg); 
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            padding: 0; 
            transition: 0.6s cubic-bezier(0.19, 1, 0.22, 1); 
            position: relative; 
            cursor: pointer; 
        }
        .card:hover { transform: translateY(-10px); border-color: var(--neon-purple); box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 0 20px rgba(157, 0, 255, 0.1); }
        
        .img-box { width: 100%; height: 500px; background: rgba(0,0,0,0.4); overflow: hidden; position: relative; border-bottom: 1px solid var(--glass-border); }
        .img-box img { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; transition: 1.2s cubic-bezier(0.19, 1, 0.22, 1); filter: contrast(1.1) brightness(0.8); }
        .card:hover .img-box img { transform: scale(1.05); opacity: 0.9; filter: contrast(1.1) brightness(1); }

        .card-info { padding: 30px; }
        .card-name { font-size: 18px; font-weight: 600; color: #fff; margin-bottom: 12px; letter-spacing: 3px; }
        .price { font-family: 'Space Mono', monospace; font-size: 1.3rem; color: var(--neon-purple); font-weight: 700; }

        /* MODAL STYLES */
        .modal { display: none; position: fixed; z-index: 5000; left: 0; top: 0; width: 100%; height: 100%; background: #000; overflow-y: auto; }
        .modal-content { max-width: 1400px; margin: 0 auto; padding: 120px 60px; }
        .close-modal { position: fixed; right: 60px; top: 60px; color: var(--neon-purple); font-size: 11px; font-family: 'Space Mono'; cursor: pointer; transition: 0.4s; z-index: 6000; border: 1px solid var(--neon-purple); padding: 10px 20px; letter-spacing: 2px; }
        .close-modal:hover { background: var(--neon-purple); color: #000; }
        
        .modal-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 100px; }
        @media (max-width: 1100px) { .modal-grid { grid-template-columns: 1fr; gap: 80px; } }

        .modal-img-container { width: 100%; height: 700px; background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: blur(20px); overflow: hidden; position: relative; cursor: grab; display: flex; align-items: center; justify-content: center; }
        .modal-main-img { width: 90%; height: 90%; object-fit: contain; transition: transform 0.1s linear; pointer-events: none; filter: drop-shadow(0 0 50px rgba(157, 0, 255, 0.2)); }
        
        .thumbnail-row { display: flex; gap: 20px; margin-top: 30px; justify-content: flex-start; }
        .thumb { width: 100px; height: 100px; border: 1px solid #111; cursor: pointer; opacity: 0.2; transition: 0.4s; object-fit: cover; filter: grayscale(100%); }
        .thumb:hover, .thumb.active { opacity: 1; border-color: #fff; filter: grayscale(0%); }

        .modal-title { font-size: 4.5rem; font-weight: 800; color: #fff; margin: 0 0 30px 0; line-height: 0.9; letter-spacing: -2px; }
        .modal-desc { font-size: 1rem; color: #666; line-height: 2; margin-bottom: 60px; font-weight: 400; text-transform: lowercase; }
        
        .specs-list { list-style: none; padding: 0; margin: 60px 0; border-top: 1px solid #111; }
        .specs-list li { padding: 20px 0; border-bottom: 1px solid #111; font-size: 12px; color: #999; display: flex; justify-content: space-between; font-family: 'Space Mono'; }
        .specs-list li b { color: #fff; font-size: 10px; }

        .modal-price { font-size:4.5rem; color: #fff; font-weight: 800; font-family: 'Space Mono'; margin-bottom: 60px; letter-spacing: -4px; text-shadow: 0 0 30px var(--neon-purple); }

        .buy-now-btn { 
            background: #fff; 
            color: #000; 
            border: none; 
            padding: 30px 50px; 
            font-family: 'Space Mono', monospace; 
            font-weight: 700; 
            font-size: 1.1rem; 
            width: 100%; 
            display: block; 
            text-align: center; 
            text-decoration: none;
            transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            letter-spacing: 5px;
            box-shadow: 0 0 40px rgba(255,255,255,0.1);
        }
        .buy-now-btn:hover { background: var(--neon-purple); color: #fff; letter-spacing: 8px; box-shadow: 0 0 50px var(--neon-purple); }

        .footer { text-align: center; padding: 150px 60px; font-size: 10px; color: #333; font-family: 'Space Mono', monospace; border-top: 1px solid var(--border); margin-top: 150px; letter-spacing: 5px;}
    </style>
</head>
<body>
    <div class="hero">
        <h1>SPACE_DUNGEON</h1>
        <p>HI-FIDELITY AUTOMATED EXTRACTION GEAR</p>
        <div style="margin-top: 60px; display: flex; gap: 30px; position: relative; z-index: 10;">
            <a href="tracking.html" class="btn-outline">LOGISTICS</a>
            <a href="support.html" class="btn-outline">SUPPORT</a>
        </div>
    </div>

    <div class="container">
        <div class="section-title">01 / PHYSICAL_UNITS</div>
        <div class="grid" id="physical-grid"></div>

        <div class="section-title">02 / CORE_BLUEPRINTS</div>
        <div class="grid" id="digital-grid"></div>
    </div>

    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">CLOSE</span>
            <div class="modal-grid">
                <div>
                    <div class="modal-img-container" id="interactionZone">
                        <img id="modal-img" src="" class="modal-main-img">
                    </div>
                    <div id="thumbnail-row" class="thumbnail-row"></div>
                    <p style="font-size: 9px; color: #222; text-align: left; margin-top: 40px; font-family: 'Space Mono'; letter-spacing: 4px;">// TACTICAL VISUAL OVERRIDE: ACTIVE</p>
                </div>
                <div>
                    <h2 id="modal-title" class="modal-title">ITEM</h2>
                    <p id="modal-desc" class="modal-desc"></p>
                    <ul id="modal-specs" class="specs-list"></ul>
                    <div id="modal-price" class="modal-price">$0.00</div>
                    <a id="modal-buy-btn" href="#" class="buy-now-btn" onclick="initiatePurchase(event)">ACQUIRE_UNIT</a>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">DIEGP04.MAKER // CORE_OS // 2026</div>

    <script>
        let isDragging = false;
        let startX = 0;
        let currentRotation = 0;
        const mainImg = document.getElementById('modal-img');
        const zone = document.getElementById('interactionZone');

        zone.addEventListener('mousedown', (e) => { isDragging = true; startX = e.clientX; });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - startX;
            startX = e.clientX;
            currentRotation += deltaX * 0.4;
            mainImg.style.transform = `perspective(2000px) rotateY(${currentRotation}deg)`;
        });
        window.addEventListener('mouseup', () => { isDragging = false; });

        function changeAngle(el, src) {
            mainImg.src = src;
            document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            currentRotation = 0;
            mainImg.style.transform = `perspective(2000px) rotateY(0deg)`;
        }

        function openModal(id) {
            const p = window.allProducts.find(item => item.id === id);
            if(!p) return;
            window.activeProduct = p;
            document.getElementById('modal-title').innerText = p.name;
            document.getElementById('modal-desc').innerText = p.desc;
            document.getElementById('modal-price').innerText = p.price;
            mainImg.src = p.img;
            document.getElementById('thumbnail-row').innerHTML = [p.img, ...(p.gallery || [])].map((src, i) => `
                <img src="${src}" class="thumb ${i===0?'active':''}" onclick="changeAngle(this, '${src}')">
            `).join('');
            document.getElementById('modal-specs').innerHTML = p.bullets.map(b => `<li>${b}</li>`).join('');
            document.getElementById('productModal').style.display = "block";
            document.body.style.overflow = "hidden";
        }

        function closeModal() { 
            document.getElementById('productModal').style.display = "none"; 
            document.body.style.overflow = "auto";
        }

        function initiatePurchase(e) {
            e.preventDefault();
            const p = window.activeProduct;
            window.location.href = `checkout.html?item=${encodeURIComponent(p.name)}&price=${p.price.replace('$','')}&img=${encodeURIComponent(p.img)}&id=${p.id}&qty=1`;
        }

        async function loadStore() {
            const res = await fetch('inventory.json');
            const products = await res.json();
            window.allProducts = products;
            
            const pGrid = document.getElementById('physical-grid');
            const dGrid = document.getElementById('digital-grid');

            products.forEach(p => {
                const target = p.yield === 'PHYSICAL' || p.yield === 'PHYSICAL_BUNDLE' ? pGrid : dGrid;
                target.innerHTML += `
                    <div class="card" onclick="openModal('${p.id}')">
                        <div class="img-box"><img src="${p.img}"></div>
                        <div class="card-info">
                            <div class="card-name">${p.name}</div>
                            <div class="price">$${p.price}</div>
                        </div>
                    </div>
                `;
            });
        }
        loadStore();
    </script>
</body>
</html>
