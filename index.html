<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIOMECH_EMPIRE // HUMAN_EVOLUTION</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bio-grid"></div>
    <div class="scanline"></div>

    <header>
        <div class="logo">
            <span class="glitch" data-text="BIOMECH_EMPIRE">BIOMECH_EMPIRE</span>
        </div>
        <nav>
            <a href="#">AUGMENTS</a>
            <a href="#">NEURAL_LINK</a>
            <a href="https://taupe-trifle-8e9dce.netlify.app" style="color: #bc13fe; border: 1px solid #bc13fe; padding: 5px 10px; border-radius: 5px; text-decoration: none; font-weight: bold; margin-left: 20px;">[SPACE_DUNGEON_EXTRACT]</a>
        </nav>
    </header>

    <main>
        <div class="hero">
            <h1>EVOLVE_BEYOND_BIOLOGY</h1>
            <p class="tagline">ELITE SYNTHETIC AUGMENTATION // GRADE_5_TITANIUM // NEURAL_FLOW</p>
        </div>

        <section id="catalog" class="product-grid">
            <!-- Products injected by JS -->
        </section>
    </main>

    <!-- Modal for Product Details -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">[CLOSE_SYSTEM]</span>
            <div class="modal-body">
                <div class="modal-info">
                    <h2 id="modalTitle"></h2>
                    <div id="modal-price" class="modal-price">$0.00</div>
                    <a id="modal-buy-btn" href="#" class="buy-now-btn" onclick="initiatePurchase(event)">BUY NOW</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadProducts() {
            try {
                const response = await fetch('inventory.json');
                const products = await response.json();
                const grid = document.querySelector('.product-grid');
                
                grid.innerHTML = products.map(p => `
                    <div class="product-card" onclick="openProduct('${p.id}')">
                        <div class="card-bg"></div>
                        <img src="${p.img}" alt="${p.name}">
                        <h3>${p.name}</h3>
                        <p class="price">$${p.price}</p>
                        <span class="status ${p.status}">${p.status.replace(/_/g, ' ')}</span>
                    </div>
                `).join('');
                
                window.productsData = products;
            } catch (err) {
                console.error("Critical System Failure: Product Sync Interrupted", err);
            }
        }

        function openProduct(id) {
            const p = window.productsData.find(item => item.id === id);
            if (!p) return;
            window.activeProduct = p;

            document.getElementById('modalTitle').innerText = p.name;
            document.getElementById('modal-price').innerText = `$${p.price}`;
            
            // Re-inject detailed info
            const overview = p.bullets.find(b => b.includes('OVERVIEW')) || '';
            const specs = p.bullets.find(b => b.includes('TACTICAL_SPECS')) || '';
            const intel = p.bullets.find(b => b.includes('USER_INTEL') || b.includes('OPERATOR_INTEL')) || '';

            // Create dynamic content areas if they don't exist
            let infoContainer = document.querySelector('.modal-info');
            infoContainer.innerHTML = `
                <h2 id="modalTitle">${p.name}</h2>
                <div id="modal-price" class="modal-price">$${p.price}</div>
                <div id="modalOverview" class="overview-section"><h3>SYSTEM_OVERVIEW</h3><p>${overview}</p><p>${p.desc}</p></div>
                <div id="modalSpecs" class="specs-grid"><h3>TECHNICAL_GUTS</h3><p>${specs}</p></div>
                <div id="modalIntel" class="intel-block"><div class="intel-box">${intel}</div></div>
                <a id="modal-buy-btn" href="#" class="buy-now-btn" onclick="initiatePurchase(event)" style="margin-top: 40px;">BUY NOW</a>
            `;

            document.getElementById('productModal').style.display = 'flex';
        }

        function initiatePurchase(event) {
            event.preventDefault();
            const p = window.activeProduct;
            // ECOMM_EXTRACTION_PROTOCOL: Redirect to Etsy Marketplace for automated fulfillment
            const etsyStoreUrl = "https://www.etsy.com/shop/YourShopName"; // User to replace with actual shop name
            const searchUrl = `${etsyStoreUrl}/search?q=${encodeURIComponent(p.name)}`;
            
            // Log the extraction attempt
            console.log(`[EXTRACTION_INITIATED]: Redirecting to Etsy unit ${p.id}`);
            
            // Optimal automated path: If we have a specific link, use it. Otherwise, search the store.
            const targetUrl = p.etsy_link || searchUrl;
            window.location.href = targetUrl;
        }

        document.querySelector('.close-btn').onclick = () => {
            document.getElementById('productModal').style.display = 'none';
        };

        window.onclick = (event) => {
            if (event.target == document.getElementById('productModal')) {
                document.getElementById('productModal').style.display = 'none';
            }
        };

        loadProducts();
    </script>
</body>
</html>
