<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SPACE_DUNGEON_COLLECTION // PHYSICAL_&_DIGITAL</title>
    <style>
        :root { --neon-green: #00ff9d; --neon-purple: #9d00ff; --deep-bg: #030305; }
        body { background: var(--deep-bg); color: #fff; font-family: 'Courier New', monospace; margin: 0; padding: 0; }
        .hero { height: 40vh; display: flex; flex-direction: column; justify-content: center; align-items: center; border-bottom: 2px solid var(--neon-purple); text-align:center;}
        .hero h1 { font-size: 3rem; color: var(--neon-green); letter-spacing: 15px; margin:0;}
        .container { max-width: 1100px; margin: 40px auto; padding: 20px; }
        .section-title { font-size: 1.5rem; color: var(--neon-purple); border-left: 5px solid var(--neon-green); padding-left: 15px; margin: 60px 0 30px 0; letter-spacing: 5px; text-transform: uppercase;}
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; }
        .card { border: 1px solid rgba(157,0,255,0.3); background: rgba(255,255,255,0.02); padding: 20px; transition: 0.3s; position: relative; }
        .card:hover { border-color: var(--neon-green); transform: translateY(-5px); box-shadow: 0 0 20px rgba(0,255,157,0.1); }
        .img-box { width: 100%; height: 250px; background: #000; margin-bottom: 15px; border: 1px solid #222; overflow: hidden; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        .price { font-size: 1.5rem; color: #fff; margin: 15px 0; }
        .buy-btn { background: var(--neon-green); color: #000; padding: 12px; text-decoration: none; display: block; text-align: center; font-weight: bold; clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%); }
        .footer { text-align: center; padding: 40px; font-size: 10px; opacity: 0.3; border-top: 1px solid #222; margin-top: 100px;}
    </style>
</head>
<body>
    <div class="hero">
        <div style="font-size:10px; color:var(--neon-purple);">[TRANSMISSION_LIVE]</div>
        <h1>SPACE_DUNGEON</h1>
        <div style="text-align:center; padding:20px;">
            <a href="tracking.html" style="color:var(--neon-green); font-weight:bold; letter-spacing:3px; text-decoration:none; border:1px solid var(--neon-green); padding:10px 20px; display:inline-block; margin: 10px;">[SHIPMENT_TRACKER]</a>
            <a href="support.html" style="color:var(--neon-purple); font-weight:bold; letter-spacing:3px; text-decoration:none; border:1px solid var(--neon-purple); padding:10px 20px; display:inline-block; margin: 10px;">[SUPPORT_PROTOCOL]</a>
        </div>
        <p>OFFICIAL_MERCHANDISE_&_AGENT_BLUEPRINTS</p>
    </div>

    <div class="container">
        <div class="section-title">PHYSICAL_LUXURY_GOODS</div>
        <div class="grid" id="physical-grid">
            <!-- INJECTED BY JS -->
        </div>

        <div class="section-title">DIGITAL_COMMAND_BLUEPRINTS</div>
        <div class="grid" id="digital-grid">
            <!-- INJECTED BY JS -->
        </div>
    </div>

    
    <div style="background: rgba(157, 0, 255, 0.1); border-top: 2px solid var(--neon-purple); padding: 50px; text-align: center; margin-top: 100px;">
        <h3 style="color: var(--neon-green); letter-spacing: 5px;">HAVE_A_TRACKING_ID?</h3>
        <p style="opacity: 0.6; margin-bottom: 30px;">DECRYPT_YOUR_PACKAGE_LOCATION_IN_REAL_TIME</p>
        <a href="tracking.html" style="background: var(--neon-purple); color: #fff; padding: 20px 50px; text-decoration: none; font-weight: bold; font-size: 1.5rem; clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%); transition: 0.3s;">TRACK_YOUR_ORDER</a>
    </div>
    <div class="footer">OPERATED BY SPACE_DUNGEON_OS // SECURE ACCESS ONLY</div>

    <script>
        async function loadStore() {
            const res = await fetch('inventory.json');
            const products = await res.json();
            
            const physGrid = document.getElementById('physical-grid');
            const digiGrid = document.getElementById('digital-grid');
            
            const store_url = "checkout.html";

            physGrid.innerHTML = products.filter(p => p.yield === 'PHYSICAL').map(p => `
                <div class="card">
                    <div class="img-box"><img src="${p.img}"></div>
                    <div style="font-size:12px; font-weight:bold;">${p.name}</div>
                    <div style="font-size:10px; opacity:0.6; margin:5px 0;">${p.desc}</div>
                    <div class="price">${p.price}</div>
                    <a href="${store_url}?item=${encodeURIComponent(p.name)}&price=${p.price.replace('$','')}&img=${encodeURIComponent(p.img)}&id=${p.id}" class="buy-btn">ORDER_SHIPMENT</a>
                </div>
            `).join('');

            digiGrid.innerHTML = products.filter(p => p.yield !== 'PHYSICAL').map(p => `
                <div class="card">
                    <div class="img-box"><img src="${p.img || 'https://v3b.fal.media/files/b/0a9d1cf8/41fy9teZUKdXCZswVd47v_3rX4DMNS.png'}"></div>
                    <div style="font-size:12px; font-weight:bold;">${p.name}</div>
                    <div style="font-size:10px; opacity:0.6; margin:5px 0;">${p.desc || 'Encrypted Blueprint'}</div>
                    <div class="price">${p.price}</div>
                    <a href="${store_url}?item=${encodeURIComponent(p.name)}&price=${p.price.replace('$','')}&img=${encodeURIComponent(p.img || '')}&id=${p.id}" class="buy-btn">DECRYPT_ACCESS</a>
                </div>
            `).join('');
        }
        loadStore();
    </script>
</body>
</html>
