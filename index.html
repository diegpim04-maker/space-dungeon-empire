<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqua Recon // Global Purity Intel</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="clinical-tactical">
    <div class="water-background"></div>
    
    <header>
        <div class="logo">Aqua Recon <span class="blink">Vigilance Active</span></div>
        <nav>
            <a href="#lab">Lab Records</a>
            <a href="#map">Purity Map</a>
            <a href="legal.html">Legal Shield</a>
            <a href="https://spacedungeontech.etsy.com" class="etsy-portal">Secure Requisition</a>
        </nav>
    </header>

    <main id="app">
        <section class="hero-section">
            <h1 class="glitch" data-text="Trust No Source.">Trust No Source.</h1>
            <p class="manifesto">We are the counter-intelligence against corporate pollution. The X1 Unit reveals the truth they are hiding in your water.</p>
        </section>

        <section id="catalog" class="product-reveal">
            <!-- AQUA_RECON_X1 Injected Here -->
        </section>
    </main>

    <script>
        async function loadProduct() {
            const resp = await fetch('inventory.json');
            const data = await resp.json();
            const container = document.getElementById('catalog');
            container.innerHTML = data.map(p => `
                <div class="x1-container">
                    <div class="visual-sector">
                        <img src="${p.img}" alt="X1 Unit">
                        <div class="scanner-line"></div>
                    </div>
                    <div class="data-sector">
                        <h2>${p.name.replace(/_/g, ' ')}</h2>
                        <div class="price-tag">$${p.price}</div>
                        <div class="status-tag pulse">${p.status.replace(/_/g, ' ')}</div>
                        <p class="p-desc">${p.desc}</p>
                        <ul class="p-bullets">
                            ${p.bullets.map(b => `<li>${b.replace(/_/g, ' ')}</li>`).join('')}
                        </ul>
                        <a href="https://spacedungeontech.etsy.com" class="buy-btn">Access Pre-Order</a>
                    </div>
                </div>
            `).join('');
        }
        loadProduct();
    </script>
</body>
</html>
