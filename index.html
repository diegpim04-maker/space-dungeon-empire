<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMPIRE_OS // REAL-TIME_INTELLIGENCE</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #050505; --accent-glow: #00f2ff; --text-main: #e0f2ff; --border-dim: rgba(0, 242, 255, 0.15); }
        body { background: var(--bg-color); color: var(--text-main); font-family: 'JetBrains Mono', monospace; margin: 0; padding: 20px; overflow-x: hidden; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1.5fr 1fr; gap: 20px; height: 95vh; }
        .panel { background: rgba(255,255,255,0.02); border: 1px solid var(--border-dim); border-radius: 4px; padding: 20px; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .panel::before { content: ""; position: absolute; top:0; left:0; width: 100%; height: 2px; background: var(--accent-glow); opacity: 0.3; }
        .panel-title { font-size: 0.7rem; color: var(--accent-glow); letter-spacing: 3px; margin-bottom: 20px; text-transform: uppercase; border-bottom: 1px solid var(--border-dim); padding-bottom: 5px; }

        /* LIVE FEED */
        .feed { font-size: 0.75rem; line-height: 1.6; color: #888; overflow-y: auto; flex-grow: 1; }
        .feed-item { margin-bottom: 15px; border-left: 2px solid #222; padding-left: 10px; }
        .feed-timestamp { color: #555; }
        .feed-agent { color: var(--accent-glow); font-weight: bold; }
        .feed-action { color: #ccc; }

        /* SALES & PRODUCTS */
        .ledger-item { display: flex; justify-content: space-between; margin-bottom: 10px; background: rgba(0,242,255,0.05); padding: 10px; border-radius: 2px; font-size: 0.8rem; }
        .price-tag { color: var(--accent-glow); font-weight: bold; }

        /* MAP/VISUAL CENTER */
        .center-panel { gap: 20px; }
        .visual-preview { width:100%; height: 50%; border: 1px solid var(--border-dim); background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative;}
        .visual-preview img { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
        .system-radar { height: 40%; border: 1px solid var(--border-dim); background: repeating-radial-gradient(circle, #050505, #050505 10px, #080808 10px, #080808 11px); position: relative; }

        /* LINKS */
        .portal-links { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
        .portal-btn { text-decoration: none; color: #fff; border: 1px solid var(--accent-glow); padding: 10px; text-align: center; font-size: 0.7rem; transition: 0.3s; }
        .portal-btn:hover { background: var(--accent-glow); color: #000; }
        
        .pulse { animation: pulse-animation 2s infinite; }
        @keyframes pulse-animation { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div class="dashboard-grid">
        <!-- LEFT: NEURAL FEED -->
        <div class="panel">
            <div class="panel-title">AGENT_NEURAL_LOGS</div>
            <div class="feed" id="agentLogs">
                <div class="feed-item">
                    <span class="feed-timestamp">[01:32:05]</span><br>
                    <span class="feed-agent">HERMES_CORE:</span>
                    <span class="feed-action">Analyzing Market Volatility Sector 09...</span>
                </div>
                <!-- Injected via Script -->
            </div>
        </div>

        <!-- CENTER: VISUAL INTELLIGENCE -->
        <div class="panel center-panel">
            <div class="panel-title">CENTRAL_VISUAL_RECON</div>
            <div class="visual-preview">
                <img src="https://v3b.fal.media/files/b/0a9df5c8/K3Q12MSmVJG1P0f6raj49_3u9dgmnS.png" alt="Sentinel Drone">
                <div style="position:absolute; top: 10px; left: 10px; font-size: 0.6rem; color: var(--accent-glow);">[LIVE_DRONE_STREAM_S-09]</div>
            </div>
            <div class="system-radar">
                <div style="position:absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: var(--accent-glow); border-radius: 50%;" class="pulse"></div>
                <div style="position:absolute; bottom: 10px; left: 10px; font-size: 0.6rem;">GRID_STATUS: NOMINAL</div>
            </div>
            <div class="portal-links">
                <a href="https://taupe-trifle-8e9dce.netlify.app" class="portal-btn">ACCESS_SPACE_DUNGEON</a>
                <a href="https://silver-cupcake-87f5fa.netlify.app" class="portal-btn">ACCESS_SYNTH_CORE</a>
                <a href="#" class="portal-btn" style="border-color: #555; color: #555;">URBAN_RECON_STAGING</a>
            </div>
        </div>

        <!-- RIGHT: REVENUE & INVENTORY -->
        <div class="panel">
            <div class="panel-title">CAPITAL_EXTRACTION_LEDGER</div>
            <div id="ledger">
                <!-- Injected via Script -->
            </div>
            <div class="panel-title" style="margin-top: 40px;">ACTIVE_MARKET_INVENTORY</div>
            <div id="inventory">
                <!-- Injected via Script -->
            </div>
        </div>
    </div>

    <script>
        // Simulation of Live Data from JSON Files
        async function loadIntelligence() {
            // Live Inventory Data
            const products = [
                {p: "Leatherman Arc", val: "249.00"},
                {p: "Muse S Neural", val: "399.00"},
                {p: "Sentinel Drone", val: "599.00"},
                {p: "Shargeek Storm", val: "199.00"}
            ];
            
            document.getElementById('inventory').innerHTML = products.map(p => `
                <div class="ledger-item">
                    <span>${p.p}</span>
                    <span class="price-tag">$${p.val}</span>
                </div>
            `).join('');

            // Simulated Agent Thoughts / Reality
            const logs = [
                {t: "02:15:32", a: "WEALTH_ARCHITECT", action: "Scanning TikTok for #EDC viral winners..."},
                {t: "02:18:10", a: "SYNTH_CORE", action: "Calibrating Neural-Link Bio-Gate..."},
                {t: "02:22:45", a: "RECON_SENTINEL", action: "Deploying Signal Scrambler X7 Visuals..."},
                {t: "02:40:01", a: "GLOBAL_MARKETING", action: "Generating Ad Packages for distribution..."}
            ];

            document.getElementById('agentLogs').innerHTML += logs.map(l => `
                <div class="feed-item">
                    <span class="feed-timestamp">[${l.t}]</span><br>
                    <span class="feed-agent">${l.a}:</span>
                    <span class="feed-action">${l.action}</span>
                </div>
            `).join('');

            // Live Sales (Simulated from Ledger)
            const sales = [
                {id: "TXN_881", price: "24,500.00", status: "PENDING_BLUEPRINT"},
                {id: "TXN_774", price: "599.00", status: "PHYSICAL_UNIT_SENTINEL"},
                {id: "TXN_652", price: "125.00", status: "COMMAND_POD_EXTRACT"}
            ];

            document.getElementById('ledger').innerHTML = sales.map(s => `
                <div class="ledger-item" style="border-left: 2px solid var(--accent-glow);">
                    <span>${s.id}</span>
                    <span class="price-tag">$${s.price}</span>
                </div>
            `).join('');
        }

        loadIntelligence();
    </script>
</body>
</html>
